<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2329">ROE 刻度尺：每一段，一个明确态度</text>

  <!-- 刻度数值（横条上方） -->
  <text x="60" y="112" text-anchor="middle" font-size="11" fill="#5a6b82">0</text>
  <text x="245" y="112" text-anchor="middle" font-size="11" fill="#5a6b82">10%</text>
  <text x="337.5" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#d9382e">15%</text>
  <text x="430" y="112" text-anchor="middle" font-size="11" fill="#5a6b82">20%</text>
  <text x="707.5" y="112" text-anchor="middle" font-size="11" fill="#5a6b82">35%</text>

  <!-- 刻度短线 -->
  <line x1="60" y1="120" x2="60" y2="130" stroke="#5a6b82" stroke-width="1.4"/>
  <line x1="245" y1="120" x2="245" y2="130" stroke="#5a6b82" stroke-width="1.4"/>
  <line x1="337.5" y1="120" x2="337.5" y2="130" stroke="#d9382e" stroke-width="1.8"/>
  <line x1="430" y1="120" x2="430" y2="130" stroke="#5a6b82" stroke-width="1.4"/>
  <line x1="707.5" y1="120" x2="707.5" y2="130" stroke="#5a6b82" stroke-width="1.4"/>

  <!-- 兜底带星标 -->
  <text x="411.5" y="100" text-anchor="middle" font-size="14" fill="#d9382e">★</text>

  <!-- 六段横条 -->
  <rect x="60" y="130" width="185" height="90" fill="#9aa0a8"/>
  <rect x="245" y="130" width="92.5" height="90" fill="#e8923c"/>
  <rect x="337.5" y="130" width="55.5" height="90" fill="#f2c14e"/>
  <rect x="393" y="118" width="37" height="114" fill="#3b82c4" stroke="#2f6fb3" stroke-width="2.5"/>
  <rect x="430" y="130" width="277.5" height="90" fill="#17a05e"/>
  <rect x="707.5" y="130" width="92.5" height="90" fill="#0e7a46"/>

  <!-- 段内文字 -->
  <text x="152.5" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">&lt;10%</text>
  <text x="152.5" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">否决</text>

  <text x="291" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">10%~15%</text>
  <text x="291" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">慎碰</text>

  <text x="365" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#6b4a00">15%~18%</text>
  <text x="365" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4a00">可考虑</text>

  <text x="411.5" y="150" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">18%~20%</text>
  <text x="411.5" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">兜底带</text>
  <text x="411.5" y="196" text-anchor="middle" font-size="10.5" fill="#e6f0fb">不否决 · 综合判断</text>

  <text x="568.75" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">20%~35%</text>
  <text x="568.75" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">稳健 · 理想操作区</text>

  <text x="753.75" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">35%+</text>
  <text x="753.75" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">优秀</text>

  <!-- 右端箭头：无上沿 -->
  <text x="816" y="176" text-anchor="middle" font-size="24" font-weight="700" fill="#0e7a46">→</text>

  <!-- 底部注释 -->
  <text x="430" y="258" text-anchor="middle" font-size="12.5" fill="#5a6b82">软刻度：15% 是操作底线（10% 只是及格，15% 以下实际不碰）；18% 是兜底带起点（贴近稳健线，不否决，综合判断）</text>
  <text x="430" y="284" text-anchor="middle" font-size="12.5" fill="#5a6b82">20% 以上没有上沿，越高越好 —— 35% 是加分项，不是终点</text>
</svg>
