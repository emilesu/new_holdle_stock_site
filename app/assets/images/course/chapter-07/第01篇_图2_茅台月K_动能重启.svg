<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2329">茅台 · 月K线（示意）2015-09 ~ 2016-05</text>

  <!-- 价格网格（示意） -->
  <line x1="45" y1="60" x2="700" y2="60" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="45" y1="160" x2="700" y2="160" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="45" y1="260" x2="700" y2="260" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="64" text-anchor="end" font-size="11" fill="#a9aeb6">250</text>
  <text x="38" y="164" text-anchor="end" font-size="11" fill="#a9aeb6">220</text>
  <text x="38" y="264" text-anchor="end" font-size="11" fill="#a9aeb6">190</text>

  <!-- ===== K线（9根月K） ===== -->
  <!-- 1: 15-09 跌 -->
  <line x1="80" y1="110" x2="80" y2="210" stroke="#17a05e" stroke-width="2"/>
  <rect x="65" y="177" width="30" height="23" fill="#17a05e"/>
  <!-- 2: 15-10 跌 -->
  <line x1="155" y1="133" x2="155" y2="240" stroke="#17a05e" stroke-width="2"/>
  <rect x="140" y="193" width="30" height="27" fill="#17a05e"/>
  <!-- 3: 15-11 跌 -->
  <line x1="230" y1="167" x2="230" y2="253" stroke="#17a05e" stroke-width="2"/>
  <rect x="215" y="210" width="30" height="30" fill="#17a05e"/>
  <!-- 4: 15-12 跌 -->
  <line x1="305" y1="187" x2="305" y2="260" stroke="#17a05e" stroke-width="2"/>
  <rect x="290" y="233" width="30" height="14" fill="#17a05e"/>
  <!-- 5: 16-01 涨 -->
  <line x1="380" y1="153" x2="380" y2="253" stroke="#d9382e" stroke-width="2"/>
  <rect x="365" y="177" width="30" height="66" fill="#d9382e"/>
  <!-- 6: 16-02 涨（红柱转弱） -->
  <line x1="455" y1="147" x2="455" y2="213" stroke="#d9382e" stroke-width="2"/>
  <rect x="440" y="180" width="30" height="13" fill="#d9382e"/>
  <!-- 7: 16-03 大阳 · 动能重启（高亮） -->
  <line x1="530" y1="87" x2="530" y2="207" stroke="#d9382e" stroke-width="2"/>
  <rect x="515" y="107" width="30" height="80" fill="#d9382e"/>
  <!-- 8: 16-04 涨 -->
  <line x1="605" y1="87" x2="605" y2="153" stroke="#d9382e" stroke-width="2"/>
  <rect x="590" y="100" width="30" height="33" fill="#d9382e"/>
  <!-- 9: 16-05 涨 -->
  <line x1="680" y1="63" x2="680" y2="133" stroke="#d9382e" stroke-width="2"/>
  <rect x="665" y="77" width="30" height="30" fill="#d9382e"/>

  <!-- 3月高亮框 + 标签 -->
  <rect x="503" y="80" width="74" height="130" fill="none" stroke="#d9382e" stroke-width="1.8" stroke-dasharray="5 4" rx="6"/>
  <text x="540" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#d9382e">动能重启 · 开窗</text>

  <!-- 月份标签 -->
  <g font-size="10.5" fill="#8a8f98" text-anchor="middle">
    <text x="80" y="278">15-09</text>
    <text x="155" y="278">15-10</text>
    <text x="230" y="278">15-11</text>
    <text x="305" y="278">15-12</text>
    <text x="380" y="278">16-01</text>
    <text x="455" y="278">16-02</text>
    <text x="530" y="278" font-weight="700" fill="#d9382e">16-03</text>
    <text x="605" y="278">16-04</text>
    <text x="680" y="278">16-05</text>
  </g>

  <!-- ===== MACD 区 ===== -->
  <text x="48" y="308" font-size="11" fill="#8a8f98">MACD 柱</text>
  <line x1="45" y1="380" x2="700" y2="380" stroke="#aeb4bc" stroke-width="1.2"/>
  <text x="55" y="384" font-size="11" fill="#8a8f98">0</text>

  <!-- 绿柱（0轴下） -->
  <rect x="63" y="380" width="34" height="45" fill="#17a05e"/>
  <rect x="138" y="380" width="34" height="60" fill="#17a05e"/>
  <rect x="213" y="380" width="34" height="52.5" fill="#17a05e"/>
  <rect x="288" y="380" width="34" height="37.5" fill="#17a05e"/>
  <!-- 红柱（0轴上） -->
  <rect x="363" y="350" width="34" height="30" fill="#d9382e"/>
  <rect x="438" y="365" width="34" height="15" fill="#d9382e"/>
  <rect x="513" y="320" width="34" height="60" fill="#d9382e"/>
  <rect x="588" y="335" width="34" height="45" fill="#d9382e"/>
  <rect x="663" y="338" width="34" height="42" fill="#d9382e"/>

  <!-- 标注：红柱连续变矮 -->
  <text x="425" y="322" text-anchor="middle" font-size="12" fill="#5a6b82">红柱连续变矮 ↓</text>
  <line x1="440" y1="328" x2="455" y2="360" stroke="#5a6b82" stroke-width="1.3" marker-end="url(#arrG)"/>

  <!-- 标注：3月突然变高 -->
  <text x="530" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#d9382e">突然变高 ↑</text>
  <line x1="530" y1="298" x2="530" y2="315" stroke="#d9382e" stroke-width="1.3" marker-end="url(#arrR)"/>

  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b82"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9382e"/>
    </marker>
  </defs>
</svg>
