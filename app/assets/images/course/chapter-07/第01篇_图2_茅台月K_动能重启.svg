<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2329">茅台 · 月K线（后复权）2015-09 ~ 2016-05</text>
  <text x="410" y="43" text-anchor="middle" font-size="10.5" fill="#8a8f98">数据：TickFlow 后复权月K · MACD(12,26,9) 脚本计算 · 供形态判定，非可交易实盘价</text>

  <!-- 价格网格：1200 / 1350 / 1500 -->
  <line x1="45" y1="112.3" x2="700" y2="112.3" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="45" y1="169.5" x2="700" y2="169.5" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="45" y1="226.8" x2="700" y2="226.8" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="116.3" text-anchor="end" font-size="11" fill="#a9aeb6">1500</text>
  <text x="38" y="173.5" text-anchor="end" font-size="11" fill="#a9aeb6">1350</text>
  <text x="38" y="230.8" text-anchor="end" font-size="11" fill="#a9aeb6">1200</text>

  <!-- ===== K线（9根月K，真实数据） ===== -->
  <!-- 1: 15-09 阴 开1166.6 高1274.3 低1125.1 收1157.4 -->
  <line x1="80" y1="198.5" x2="80" y2="255.4" stroke="#17a05e" stroke-width="2"/>
  <rect x="65" y="238.4" width="30" height="6" fill="#17a05e"/>
  <!-- 2: 15-10 阳 开1208.9 高1327.6 低1195.0 收1300.6 -->
  <line x1="155" y1="178.1" x2="155" y2="228.7" stroke="#d9382e" stroke-width="2"/>
  <rect x="140" y="188.4" width="30" height="35" fill="#d9382e"/>
  <!-- 3: 15-11 阴（十字） 开1305.1 高1366.3 低1256.6 收1303.4 -->
  <line x1="230" y1="163.3" x2="230" y2="205.2" stroke="#17a05e" stroke-width="2"/>
  <rect x="215" y="184" width="30" height="6" fill="#17a05e"/>
  <!-- 4: 15-12 阳 开1295.4 高1393.8 低1271.1 收1327.0 -->
  <line x1="305" y1="152.8" x2="305" y2="199.7" stroke="#d9382e" stroke-width="2"/>
  <rect x="290" y="178.4" width="30" height="12" fill="#d9382e"/>
  <!-- 5: 16-01 大阴 开1325.8 高1325.8 低1189.0 收1220.3 -->
  <line x1="380" y1="178.8" x2="380" y2="231.0" stroke="#17a05e" stroke-width="2"/>
  <rect x="365" y="178.8" width="30" height="40.3" fill="#17a05e"/>
  <!-- 6: 16-02 阳 开1229.1 高1343.3 低1213.9 收1307.0 -->
  <line x1="455" y1="172.1" x2="455" y2="221.5" stroke="#d9382e" stroke-width="2"/>
  <rect x="440" y="186" width="30" height="29.7" fill="#d9382e"/>
  <!-- 7: 16-03 大阳 · 动能重启（高亮） 开1313.4 高1541.0 低1279.6 收1506.1 -->
  <line x1="530" y1="96.6" x2="530" y2="196.5" stroke="#d9382e" stroke-width="2"/>
  <rect x="515" y="110" width="30" height="73.5" fill="#d9382e"/>
  <!-- 8: 16-04 阳 开1514.0 高1566.6 低1434.0 收1527.7 -->
  <line x1="605" y1="86.8" x2="605" y2="137.5" stroke="#d9382e" stroke-width="2"/>
  <rect x="590" y="101.3" width="30" height="6" fill="#d9382e"/>
  <!-- 9: 16-05 阳 开1523.8 高1621.5 低1478.4 收1608.4 -->
  <line x1="680" y1="65.9" x2="680" y2="120.5" stroke="#d9382e" stroke-width="2"/>
  <rect x="665" y="70.9" width="30" height="32.3" fill="#d9382e"/>

  <!-- 3月高亮框 + 标签 -->
  <rect x="505" y="88" width="70" height="116" fill="none" stroke="#d9382e" stroke-width="1.8" stroke-dasharray="5 4" rx="6"/>
  <text x="540" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#d9382e">动能重启 · 开窗</text>

  <!-- 月份标签 -->
  <g font-size="10.5" fill="#8a8f98" text-anchor="middle">
    <text x="80" y="285">15-09</text>
    <text x="155" y="285">15-10</text>
    <text x="230" y="285">15-11</text>
    <text x="305" y="285">15-12</text>
    <text x="380" y="285">16-01</text>
    <text x="455" y="285">16-02</text>
    <text x="530" y="285" font-weight="700" fill="#d9382e">16-03</text>
    <text x="605" y="285">16-04</text>
    <text x="680" y="285">16-05</text>
  </g>

  <!-- ===== MACD 区（红柱全程在0轴上方，只是高度在变矮） ===== -->
  <text x="48" y="312" font-size="11" fill="#8a8f98">MACD 柱</text>
  <line x1="45" y1="380" x2="700" y2="380" stroke="#aeb4bc" stroke-width="1.2"/>
  <text x="55" y="384" font-size="11" fill="#8a8f98">0</text>

  <!-- 红柱（0轴上，真实 MACD 柱值：53.9→49.3→42.4→37.0→16.1→11.2→31.0→42.4→55.5） -->
  <rect x="63" y="323.7" width="34" height="56.3" fill="#d9382e"/>
  <rect x="138" y="328.5" width="34" height="51.5" fill="#d9382e"/>
  <rect x="213" y="335.7" width="34" height="44.3" fill="#d9382e"/>
  <rect x="288" y="341.4" width="34" height="38.6" fill="#d9382e"/>
  <rect x="363" y="363.2" width="34" height="16.8" fill="#d9382e"/>
  <rect x="438" y="368.3" width="34" height="11.7" fill="#d9382e"/>
  <rect x="513" y="347.6" width="34" height="32.4" fill="#d9382e"/>
  <rect x="588" y="335.7" width="34" height="44.3" fill="#d9382e"/>
  <rect x="663" y="322" width="34" height="58" fill="#d9382e"/>

  <!-- 标注：红柱连续变矮 -->
  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#5a6b82">红柱连续变矮 ↓</text>
  <line x1="435" y1="306" x2="452" y2="364" stroke="#5a6b82" stroke-width="1.3" marker-end="url(#arrB)"/>

  <!-- 标注：3月突然变高 -->
  <text x="540" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#d9382e">突然变高 ↑</text>
  <line x1="540" y1="306" x2="530" y2="344" stroke="#d9382e" stroke-width="1.3" marker-end="url(#arrR)"/>

  <!-- 图例 -->
  <g font-size="10.5" fill="#666">
    <rect x="615" y="298" width="9" height="9" fill="#d9382e" rx="1.5"/>
    <text x="628" y="306">阳线 / 红柱</text>
    <rect x="615" y="316" width="9" height="9" fill="#17a05e" rx="1.5"/>
    <text x="628" y="324">阴线</text>
  </g>

  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b82"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9382e"/>
    </marker>
  </defs>
</svg>
