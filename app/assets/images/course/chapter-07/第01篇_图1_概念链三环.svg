<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9382e"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="420" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2329">状态A → 开窗 → 才进入准备买入</text>
  <text x="420" y="62" text-anchor="middle" font-size="13" fill="#8a8f98">上面一条：原课程讲到的链条　｜　下面一条：进阶篇补全后的链条</text>

  <!-- ===== 上行：原课程讲到的链条 ===== -->
  <text x="20" y="118" font-size="12.5" fill="#8a8f98">原课程</text>
  <text x="20" y="138" font-size="12.5" fill="#8a8f98">讲到「是」为止</text>

  <!-- 框1 状态A -->
  <rect x="150" y="92" width="190" height="70" rx="10" fill="#eef4fc" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="245" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2329">状态A</text>
  <text x="245" y="146" text-anchor="middle" font-size="12" fill="#5a6b82">环境 · 持续条件</text>

  <!-- 虚线箭头 + 问号 -->
  <line x1="340" y1="127" x2="505" y2="127" stroke="#c2c7cf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="415" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#d9382e">？</text>

  <!-- 框2 可以买？ -->
  <rect x="510" y="92" width="210" height="70" rx="10" fill="#f4f5f7" stroke="#c2c7cf" stroke-width="1.5"/>
  <text x="615" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#8a8f98">可以买？</text>
  <text x="615" y="146" text-anchor="middle" font-size="12" fill="#a9aeb6">中间一环，没被拆开</text>

  <!-- ===== 下行：进阶篇补全后的链条 ===== -->
  <text x="20" y="282" font-size="12.5" fill="#8a8f98">进阶篇</text>
  <text x="20" y="302" font-size="12.5" fill="#8a8f98">补上这一环</text>

  <!-- 框1 状态A -->
  <rect x="120" y="252" width="190" height="70" rx="10" fill="#eef4fc" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="215" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2329">状态A</text>
  <text x="215" y="306" text-anchor="middle" font-size="12" fill="#5a6b82">环境 · 持续条件</text>

  <!-- 箭头 -->
  <line x1="310" y1="287" x2="385" y2="287" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 框2 开窗（高亮） -->
  <rect x="390" y="242" width="200" height="90" rx="10" fill="#fdeeee" stroke="#d9382e" stroke-width="2.5"/>
  <text x="490" y="276" text-anchor="middle" font-size="20" font-weight="700" fill="#d9382e">开窗</text>
  <text x="490" y="302" text-anchor="middle" font-size="12.5" fill="#d9382e">单次事件 · 只此一根</text>
  <text x="490" y="320" text-anchor="middle" font-size="12.5" fill="#d9382e">需要单独确认</text>

  <!-- 箭头 -->
  <line x1="590" y1="287" x2="655" y2="287" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 框3 才进入准备买入 -->
  <rect x="660" y="252" width="160" height="70" rx="10" fill="#e9f7ef" stroke="#17a05e" stroke-width="1.5"/>
  <text x="740" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2329">才进入</text>
  <text x="740" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2329">准备买入</text>

  <!-- 底部说明 -->
  <rect x="120" y="366" width="700" height="40" rx="8" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="1"/>
  <text x="470" y="390" text-anchor="middle" font-size="13" fill="#5a6b82">「开窗」是单次事件，只发生在柱子状态变化的那根月K——状态A 天天都在，开窗一年等不了几次</text>
</svg>
