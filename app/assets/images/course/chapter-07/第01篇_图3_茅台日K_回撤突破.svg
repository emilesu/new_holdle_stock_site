<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2329">茅台 · 日K线（示意）2016 年 3 月底 — 5 月初</text>

  <!-- 价格网格（示意） -->
