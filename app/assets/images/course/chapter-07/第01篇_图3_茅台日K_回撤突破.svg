  <!-- 9 -->
  <line x1="396" y1="155" x2="396" y2="193" stroke="#17a05e" stroke-width="2"/>
  <rect x="385" y="161" width="22" height="19" fill="#17a05e"/>
  <!-- 10 -->
  <line x1="438" y1="174" x2="438" y2="206" stroke="#17a05e" stroke-width="2"/>
  <rect x="427" y="180" width="22" height="13" fill="#17a05e"/>
  <!-- 11 -->
  <line x1="480" y1="187" x2="480" y2="218" stroke="#17a05e" stroke-width="2"/>
  <rect x="469" y="193" width="22" height="13" fill="#17a05e"/>
  <!-- 12 -->
  <line x1="522" y1="180" x2="522" y2="212" stroke="#d9382e" stroke-width="2"/>
  <rect x="511" y="199" width="22" height="7" fill="#d9382e"/>
  <!-- 13 -->
  <line x1="564" y1="168" x2="564" y2="206" stroke="#d9382e" stroke-width="2"/>
  <rect x="553" y="187" width="22" height="12" fill="#d9382e"/>
  <!-- 14 -->
  <line x1="606" y1="149" x2="606" y2="193" stroke="#d9382e" stroke-width="2"/>
  <rect x="595" y="168" width="22" height="25" fill="#d9382e"/>
  <!-- 15 -->
