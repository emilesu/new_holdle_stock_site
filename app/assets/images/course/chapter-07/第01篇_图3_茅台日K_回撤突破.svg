  <rect x="91" y="355" width="22" height="10" fill="#d9382e"/>
  <rect x="133" y="358" width="22" height="7" fill="#d9382e"/>
  <rect x="175" y="361" width="22" height="4" fill="#d9382e"/>
  <rect x="217" y="364" width="22" height="2" fill="#d9382e"/>
  <rect x="553" y="364" width="22" height="2" fill="#d9382e"/>
  <rect x="595" y="360" width="22" height="5" fill="#d9382e"/>
  <rect x="637" y="357" width="22" height="8" fill="#d9382e"/>
  <rect x="679" y="347" width="22" height="18" fill="#d9382e"/>

  <!-- 绿柱（0轴下，回撤期） -->
  <rect x="259" y="365" width="22" height="5" fill="#17a05e"/>
  <rect x="301" y="365" width="22" height="10" fill="#17a05e"/>
  <rect x="343" y="365" width="22" height="15" fill="#0e7a46"/>
  <rect x="385" y="365" width="22" height="12" fill="#17a05e"/>
  <rect x="427" y="365" width="22" height="8" fill="#17a05e"/>
  <rect x="469" y="365" width="22" height="6" fill="#17a05e"/>
  <rect x="511" y="365" width="22" height="2" fill="#17a05e"/>

  <!-- 4/11 绿柱小标注 -->
  <line x1="354" y1="392" x2="354" y2="405" stroke="#0e7a46" stroke-width="1.3" marker-end="url(#arrG)"/>

  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7a46"/>
    </marker>
  </defs>
</svg>
