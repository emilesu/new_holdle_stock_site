  <rect x="175" y="142" width="22" height="26" fill="#d9382e"/>
  <!-- 5: 4/6 冲高 -->
  <line x1="228" y1="85" x2="228" y2="155" stroke="#d9382e" stroke-width="2"/>
  <rect x="217" y="104" width="22" height="38" fill="#d9382e"/>
  <!-- 6: 4/7 回落 -->
  <line x1="270" y1="98" x2="270" y2="130" stroke="#17a05e" stroke-width="2"/>
