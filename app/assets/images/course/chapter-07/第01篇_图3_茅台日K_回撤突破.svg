  <line x1="45" y1="250" x2="700" y2="250" stroke="#eceff3" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="38" y="64" text-anchor="end" font-size="11" fill="#a9aeb6">235</text>
  <text x="38" y="159" text-anchor="end" font-size="11" fill="#a9aeb6">220</text>
  <text x="38" y="254" text-anchor="end" font-size="11" fill="#a9aeb6">205</text>

  <!-- ===== 日K线（16根示意） ===== -->
  <!-- 1 -->
  <line x1="60" y1="206" x2="60" y2="250" stroke="#d9382e" stroke-width="2"/>
