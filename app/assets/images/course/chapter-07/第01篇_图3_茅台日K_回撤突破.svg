  <line x1="228" y1="85" x2="720" y2="85" stroke="#d9382e" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.75"/>
  <text x="250" y="76" font-size="12.5" font-weight="700" fill="#d9382e">4/6 高点 = 入场参考价</text>

  <!-- 5/3 突破买入标注 -->
  <circle cx="690" cy="66" r="7" fill="none" stroke="#d9382e" stroke-width="1.8"/>
  <text x="690" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#d9382e">5/3 突破前高 · 买入</text>

  <!-- 关键日期 -->
  <text x="228" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#d9382e">4/6</text>
  <text x="354" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#17a05e">4/11</text>
  <text x="690" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#d9382e">5/3</text>

  <!-- ===== MACD 区 ===== -->
  <line x1="45" y1="365" x2="700" y2="365" stroke="#aeb4bc" stroke-width="1.2"/>
  <text x="55" y="369" font-size="11" fill="#8a8f98">0</text>

  <!-- 回撤绿柱区域框 -->
  <rect x="256" y="278" width="282" height="108" fill="#e9f7ef" opacity="0.55" stroke="#17a05e" stroke-width="1.4" stroke-dasharray="4 3" rx="6"/>
  <text x="397" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e7a46">回撤出绿柱 · 正常回撤确认</text>

  <!-- 红柱（0轴上） -->
