<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2329">东鹏饮料 · 月K红柱：红线前不作数，红线后才是信号</text>
  <text x="430" y="43" text-anchor="middle" font-size="10.5" fill="#8a8f98">数据：后复权月K · MACD(12,26,9) · 柱高按数值同比例 · 供形态判定，非可交易实盘价</text>

  <!-- 时间轴条：灰段（不满30个月） -->
  <rect x="150" y="58" width="360" height="34" fill="#e8ebf0"/>
  <text x="330" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5a6b82">不满30个月 · 红柱不作数</text>
  <!-- 绿段（满30个月） -->
  <rect x="510" y="58" width="216" height="34" fill="#17a05e"/>
  <text x="618" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">满30个月 · 红柱才算数</text>

  <!-- 30个月红线 -->
  <line x1="510" y1="50" x2="510" y2="345" stroke="#d9382e" stroke-width="2.5"/>
  <text x="510" y="44" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d9382e">30个月红线</text>

  <!-- 0轴 -->
  <line x1="130" y1="330" x2="750" y2="330" stroke="#aeb4bc" stroke-width="1.2"/>
  <text x="138" y="334" font-size="11" fill="#8a8f98">0</text>

  <!-- ===== 红线前：两根灰柱，不作数 ===== -->
  <!-- 21.72（2021-06，上市第2个月） -->
  <rect x="146" y="200" width="28" height="130" fill="#c9cdd4" rx="1.5"/>
  <text x="160" y="215" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b7280">21.72</text>
  <text x="160" y="352" text-anchor="middle" font-size="11" fill="#8a8f98">2021-06 上市第2个月</text>
  <!-- 27.77（2021-09，上市第5个月） -->
  <rect x="191" y="163" width="28" height="167" fill="#c9cdd4" rx="1.5"/>
  <text x="205" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b7280">27.77</text>
  <text x="205" y="352" text-anchor="middle" font-size="11" fill="#8a8f98">2021-09 上市第5个月</text>

  <!-- 灰柱区框：不作数 -->
  <rect x="138" y="148" width="90" height="190" fill="none" stroke="#aeb4bc" stroke-width="1.5" stroke-dasharray="5 4" rx="6"/>
  <text x="183" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#8a8f98">上市初期 · 不作数</text>
  <!-- 灰柱上的红叉 -->
  <path d="M 155 195 L 165 205 M 165 195 L 155 205" stroke="#d9382e" stroke-width="2"/>
  <path d="M 200 158 L 210 168 M 210 158 L 200 168" stroke="#d9382e" stroke-width="2"/>

  <!-- ===== 红线后：1.69（矮，但合格） ===== -->
  <rect x="568" y="320" width="28" height="10" fill="#d9382e" rx="1.5"/>
  <rect x="560" y="298" width="44" height="40" fill="none" stroke="#d9382e" stroke-width="1.6" stroke-dasharray="5 4" rx="6"/>
  <text x="582" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#d9382e">1.69</text>
  <line x1="604" y1="318" x2="622" y2="318" stroke="#d9382e" stroke-width="1.2"/>
  <text x="626" y="314" font-size="12.5" font-weight="700" fill="#d9382e">首个合格开窗</text>
  <text x="626" y="332" font-size="11" fill="#8a8f98">2024-05 · 上市第36个月</text>

  <!-- ===== 红线后：31.86（动能延续） ===== -->
  <rect x="712" y="139" width="28" height="191" fill="#d9382e" rx="1.5"/>
  <text x="726" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">31.86</text>
  <text x="726" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d9382e">2025-05 · 约+96%</text>
  <text x="726" y="352" text-anchor="middle" font-size="11" fill="#8a8f98">2025-05</text>

  <!-- 底部对照说明 -->
  <text x="183" y="385" text-anchor="middle" font-size="12" fill="#5a6b82">2022-04 股价 250.8 → 125.9</text>
  <text x="183" y="405" text-anchor="middle" font-size="11" fill="#8a8f98">腰斩</text>

  <text x="650" y="385" text-anchor="middle" font-size="12" fill="#5a6b82">2024-06 ~ 2025-05 股价 225 → 441.6</text>
  <text x="650" y="405" text-anchor="middle" font-size="11" fill="#8a8f98">约 +96%</text>

  <text x="430" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2329">柱子27.77的时候不能做，柱子1.69的时候能做了 —— 不是柱子高不高的问题，是样本够不够的问题</text>
</svg>
