<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="430" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2329">跌破才卖</text>
  <text x="430" y="48" text-anchor="middle" font-size="12.5" fill="#8a8f98">卖出触发：周K最低价跌破参考价。示意 · 非真实数据</text>

  <!-- 参考价虚线：从低点④开始向右延伸 -->
  <line x1="320" y1="240" x2="720" y2="240" stroke="#d9382e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="730" y="230" font-size="11" fill="#d9382e" font-weight="700">参考价 = 245</text>
  <text x="730" y="245" font-size="10" fill="#8a8f98">（低点④）</text>

  <!-- 价格走势折线：前高低（y=185）→ 低点④（y=240）→ 创新高（y=100）→ 跌破卖出（y=255） -->
  <polyline points="80,220 140,185 200,210 260,222 320,240 380,210 440,155 500,100 560,165 620,220 680,255 740,240" fill="none" stroke="#3b82c4" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 数据点 -->
  <circle cx="80" cy="220" r="2.2" fill="#3b82c4"/>
  <circle cx="320" cy="240" r="2.2" fill="#3b82c4"/>
  <circle cx="500" cy="100" r="2.2" fill="#3b82c4"/>
  <circle cx="680" cy="255" r="2.2" fill="#3b82c4"/>

  <!-- 跌破点高亮 -->
  <circle cx="680" cy="255" r="5" fill="none" stroke="#d9382e" stroke-width="1.5"/>

  <!-- 低点④标注 -->
  <text x="320" y="230" text-anchor="middle" font-size="10.5" fill="#17a05e" font-weight="700">低点④ = 245</text>

  <!-- 创新高标注：紧贴折线顶点上方 -->
  <text x="500" y="88" text-anchor="middle" font-size="10.5" fill="#3b82c4" font-weight="700">创新高</text>

  <!-- 跌破卖出标注 -->
  <polyline points="680,255 700,290 720,290" fill="none" stroke="#d9382e" stroke-width="1"/>
  <circle cx="720" cy="290" r="2" fill="#d9382e"/>
  <text x="725" y="285" font-size="11" fill="#d9382e" font-weight="700">最低价跌破参考价245</text>
  <text x="725" y="300" font-size="11" fill="#d9382e" font-weight="700">→ 卖出</text>

  <!-- 底部说明条 -->
  <rect x="30" y="460" width="800" height="42" rx="8" fill="#fdf3f2" stroke="#d9382e" stroke-width="1.4"/>
  <text x="430" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#d9382e">卖出是被动触发的，不是预测到顶主动做的。不赌顶，只跟随。</text>

  <!-- 金句 -->
  <text x="430" y="536" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2329">不赌顶，只跟随</text>
</svg>