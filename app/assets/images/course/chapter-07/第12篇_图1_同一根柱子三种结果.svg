<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- ===== 图1 重绘版 v2（2026-10-30）：0.03 相对量口径 ===== -->
  <!-- 说明：三根柱子改按"柱子÷慢线(DEA)"比值表示；±0.03 分界线可见，三根比值全部落在存疑区 -->
  <!-- A股红涨绿跌：红 #d9382e / 绿 #17a05e -->

  <!-- 标题 -->
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2329">同一根柱子，三个数据源，三种结果</text>
  <text x="420" y="58" text-anchor="middle" font-size="13" fill="#8a8f98">复权口径的微小差异，在0轴附近把正负号翻了过来</text>

  <!-- 量纲说明 -->
  <text x="420" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6b82">纵轴＝柱子 ÷ 慢线（DEA），不是柱值本身</text>

  <!-- 存疑区背景：-0.03 ~ +0.03 -->
  <rect x="60" y="160" width="720" height="110" fill="#faf3e0" opacity="0.6"/>
  <line x1="60" y1="160" x2="780" y2="160" stroke="#e8a13d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="60" y1="270" x2="780" y2="270" stroke="#e8a13d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="776" y="154" text-anchor="end" font-size="12" font-weight="700" fill="#c07f1f">+0.03（即 +3%，方向可靠线）</text>
  <text x="776" y="290" text-anchor="end" font-size="12" font-weight="700" fill="#c07f1f">−0.03（即 −3%，方向可靠线）</text>

  <!-- 0轴（y=215，1单位=1833.33px） -->
  <line x1="60" y1="215" x2="780" y2="215" stroke="#8a8f98" stroke-width="1.2"/>

  <!-- 软件标签 -->
  <text x="170" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2329">软件A</text>
  <text x="400" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2329">软件B</text>
  <text x="630" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2329">软件C</text>

  <!-- 三根柱子：比值 +0.026 / −0.004 / +0.011，全部落在 ±0.03 之内 -->
  <rect x="150" y="167.3" width="40" height="47.7" fill="#d9382e"/>
  <rect x="380" y="215" width="40" height="7.3" fill="#17a05e"/>
  <rect x="610" y="194.8" width="40" height="20.2" fill="#d9382e"/>

  <!-- 比值与判定 -->
  <text x="170" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#d9382e">+0.026</text>
  <text x="170" y="340" text-anchor="middle" font-size="13" fill="#5a6b82">红柱</text>
  <text x="400" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#17a05e">−0.004</text>
  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#5a6b82">绿柱</text>
  <text x="630" y="316" text-anchor="middle" font-size="22" font-weight="700" fill="#d9382e">+0.011</text>
  <text x="630" y="340" text-anchor="middle" font-size="13" fill="#5a6b82">红柱</text>

  <!-- 底部结论 -->
  <rect x="60" y="368" width="720" height="58" rx="8" fill="#f7f8fa" stroke="#e3e6ea" stroke-width="1"/>
  <text x="420" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2329">三根都在 ±0.03 之内：两种方向，正负不一是常态</text>
  <text x="420" y="414" text-anchor="middle" font-size="12.5" fill="#5a6b82">换一个复权口径，这根柱子的正负号就能翻过来</text>
</svg>
