<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 标题 -->
  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2329">30个月红线：MACD 要攒多久，才谈得上信号</text>

  <!-- 灰段：0 ~ 30个月（上市初期，样本不足） -->
  <rect x="140" y="150" width="360" height="90" fill="#e8ebf0"/>
  <!-- 绿段：30个月之后（有资格开窗） -->
  <rect x="500" y="150" width="216" height="90" fill="#17a05e"/>

  <!-- 26个月刻度虚线（慢线DEA最短数据） -->
  <line x1="452" y1="140" x2="452" y2="250" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 30个月红线 -->
  <line x1="500" y1="132" x2="500" y2="256" stroke="#d9382e" stroke-width="3"/>

  <!-- 时间轴底线 -->
  <line x1="140" y1="250" x2="716" y2="250" stroke="#1f2329" stroke-width="2"/>

  <!-- 刻度标签 -->
  <text x="140" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2329">上市</text>
  <text x="452" y="272" text-anchor="middle" font-size="11" fill="#8a8f98">26个月</text>
  <text x="500" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d9382e">30个月</text>
  <text x="716" y="272" text-anchor="middle" font-size="11" fill="#8a8f98">48个月</text>

  <!-- 灰段文字 -->
  <text x="320" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#5a6b82">上市初期 · 样本不足</text>
  <text x="320" y="207" text-anchor="middle" font-size="13" fill="#6b7280">柱子再红，不作数</text>
  <text x="320" y="229" text-anchor="middle" font-size="11.5" fill="#8a8f98">26个月刚够算慢线，仍不稳</text>

  <!-- 绿段文字 -->
  <text x="608" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">满30个月 · 有资格开窗</text>
  <text x="608" y="207" text-anchor="middle" font-size="12.5" fill="#e2f4ec">统计量攒够，红柱才算信号</text>

  <!-- 底部说明 + 金句 -->
  <text x="430" y="298" text-anchor="middle" font-size="12.5" fill="#5a6b82">30个月是中间值：26个月刚够算慢线，36个月偏严，可能错过机会</text>
  <text x="430" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2329">上市不满30个月，MACD 还没攒够自己的历史，柱子再红也不作数</text>
</svg>
